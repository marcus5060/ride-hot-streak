server.address=0.0.0.0
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

# MySQL. Defaults match the "db" service in .devcontainer/docker-compose.yml.
# In production, override these three with env vars from your host's managed DB.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:demo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:demo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
